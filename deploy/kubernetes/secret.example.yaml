apiVersion: v1
kind: Secret
metadata:
  name: samjho-secret
  namespace: samjho
type: Opaque
stringData:
  # Do not commit the real token here. Use a sealed secret or inject from a vault.
  # Replace this value with your JarvisLabs API token before applying.
  JARVIS_API_TOKEN: "paste_your_jarvislabs_api_token_here"
